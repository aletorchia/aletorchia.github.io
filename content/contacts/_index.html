<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alessandro Torchia — Contatti</title>
  <meta name="description" content="Contatti, social e link utili di Alessandro Torchia." />

  <meta property="og:title" content="Alessandro Torchia — Contatti" />
  <meta property="og:description" content="Contatti, social e link utili." />
  <meta property="og:type" content="website" />

  <script>
    document.documentElement.classList.add("contact-card-page");
    document.body?.classList.add("contact-card-page");
    window.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("contact-card-page");
    });
  </script>

  <style>
    :root {
      --bg: #121318;
      --panel: rgba(255,255,255,0.065);
      --panel-strong: rgba(255,255,255,0.10);
      --line: rgba(255,255,255,0.12);
      --text: #f6f7fb;
      --muted: #aeb6c8;
      --soft: #808799;
      --accent: #7c5cff;
      --accent-2: #1fb6ff;
      --radius: 30px;
      --shadow: 0 30px 90px rgba(0,0,0,0.38);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 18%, rgba(124,92,255,0.20), transparent 30rem),
        radial-gradient(circle at 82% 72%, rgba(31,182,255,0.13), transparent 28rem),
        linear-gradient(180deg, #15161c 0%, #101116 100%);
      overflow-x: hidden;
    }

    /* Nasconde navbar/icone/titolo del tema SOLO in questa pagina */
    html.contact-card-page header,
    html.contact-card-page nav,
    html.contact-card-page .navbar,
    html.contact-card-page .site-header,
    html.contact-card-page .site-nav,
    html.contact-card-page .topbar,
    html.contact-card-page .app-header,
    html.contact-card-page .hextra-navbar,
    html.contact-card-page .hx-sticky,
    html.contact-card-page .search,
    html.contact-card-page .search-button,
    html.contact-card-page .search-toggle,
    html.contact-card-page [role="search"],
    html.contact-card-page .theme-toggle,
    html.contact-card-page .color-mode-toggle,
    html.contact-card-page .github,
    html.contact-card-page .github-link,
    body.contact-card-page header,
    body.contact-card-page nav,
    body.contact-card-page .navbar,
    body.contact-card-page .site-header,
    body.contact-card-page .site-nav,
    body.contact-card-page .topbar,
    body.contact-card-page .app-header,
    body.contact-card-page .hextra-navbar,
    body.contact-card-page .hx-sticky,
    body.contact-card-page .search,
    body.contact-card-page .search-button,
    body.contact-card-page .search-toggle,
    body.contact-card-page [role="search"],
    body.contact-card-page .theme-toggle,
    body.contact-card-page .color-mode-toggle,
    body.contact-card-page .github,
    body.contact-card-page .github-link {
      display: none !important;
    }

    html.contact-card-page body > main > h1:first-child,
    html.contact-card-page body > main .content > h1:first-child,
    html.contact-card-page body > main article > h1:first-child,
    html.contact-card-page body > main .hx-text-4xl:first-child,
    body.contact-card-page > main > h1:first-child,
    body.contact-card-page > main .content > h1:first-child,
    body.contact-card-page > main article > h1:first-child,
    body.contact-card-page > main .hx-text-4xl:first-child {
      display: none !important;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.026) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: clamp(42px, 7vh, 82px) 0 56px;
    }

    .card-only-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .phone-wrap {
      position: relative;
      width: min(100%, 410px);
    }

    .card-only {
      justify-self: center;
    }

    .glow {
      position: absolute;
      inset: 10% -10% 5% -10%;
      background: linear-gradient(135deg, rgba(124,92,255,0.34), rgba(31,182,255,0.20));
      filter: blur(64px);
      border-radius: 999px;
      opacity: 0.9;
    }

    .card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(22px, 3vw, 28px);
      background: linear-gradient(180deg, rgba(255,255,255,0.095), rgba(255,255,255,0.045));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(255,255,255,0.16), transparent 16rem);
      pointer-events: none;
    }

    .card > * { position: relative; }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .nfc {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .identity {
      text-align: center;
      display: grid;
      gap: 16px;
      margin-bottom: 34px;
    }

    .name {
      font-size: clamp(2.65rem, 9vw, 3.4rem);
      line-height: 0.98;
      letter-spacing: -0.065em;
      margin: 0;
    }

    .bio {
      color: var(--muted);
      line-height: 1.55;
      margin: 0 auto;
      max-width: 28ch;
      font-size: 1rem;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 0;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 15px 16px;
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,0.075);
      border: 1px solid var(--line);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      font: inherit;
      font-weight: 780;
      cursor: pointer;
      text-align: left;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.24);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      box-shadow: 0 18px 40px rgba(31,182,255,0.18);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 10px 24px rgba(0,0,0,0.18);
      overflow: hidden;
      isolation: isolate;
    }

    .icon svg {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: none;
      overflow: visible;
    }

    .icon-save {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(255,255,255,0.24), rgba(255,255,255,0.10));
    }

    .icon-email {
      color: #4aa8ff;
      background: radial-gradient(circle at 30% 20%, rgba(74,168,255,0.32), rgba(255,255,255,0.07));
      border-color: rgba(74,168,255,0.28);
    }

    .icon-whatsapp {
      color: #25d366;
      background: rgba(37,211,102,0.14);
      border-color: rgba(37,211,102,0.26);
    }

    .icon-whatsapp svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.9;
      transform: translateX(0.5px);
    }

    .icon-instagram {
      color: #ff4b7d;
      background:
        radial-gradient(circle at 28% 110%, rgba(255,193,7,0.28), transparent 42%),
        radial-gradient(circle at 76% 18%, rgba(124,92,255,0.34), transparent 38%),
        radial-gradient(circle at 30% 20%, rgba(255,45,85,0.32), rgba(255,255,255,0.07));
      border-color: rgba(255,75,125,0.30);
    }

    .arrow {
      color: rgba(255,255,255,0.64);
      font-size: 1.15rem;
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 22px, 1080px);
        padding: 28px 0;
      }

      .card {
        padding: 18px;
        border-radius: 25px;
      }
    }
  </style>
</head>
<body class="contact-card-page">
  <main class="page card-only-page">
    <div class="phone-wrap card-only">
      <div class="glow" aria-hidden="true"></div>

      <section class="card" aria-label="Scheda contatto">
        <div class="top-row">
          <span class="badge">✨ Digital card</span>
          <span class="nfc" aria-label="NFC">⌁</span>
        </div>

        <div class="identity">
          <h1 class="name">Alessandro<br />Torchia</h1>
          <p class="bio">scegli come contattarmi e salva il contatto in rubrica</p>
        </div>

        <div class="links">
          <button class="btn primary" type="button" onclick="downloadVCard()">
            <span class="left"><span class="icon icon-save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h3"></path><path d="M16 15v4"></path><path d="M14 17h4"></path></svg></span> Salva contatto</span>
            <span class="arrow">↓</span>
          </button>

          <a class="btn" href="mailto:alessandrotorchia@proton.me">
            <span class="left"><span class="icon icon-email"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4z"></path><path d="M4.8 7.3 12 13l7.2-5.7"></path><path d="m4.8 16.7 5.2-4.2"></path><path d="m19.2 16.7-5.2-4.2"></path></svg></span> Email</span>
            <span class="arrow">→</span>
          </a>

          <a class="btn" href="https://wa.me/393921492843" target="_blank" rel="noopener">
            <span class="left"><span class="icon icon-whatsapp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.7a7.8 7.8 0 0 1-11.2 7l-3.3.8.9-3.2A7.8 7.8 0 1 1 20 11.7Z"></path><path d="M9.3 10.2h5.4"></path><path d="M9.3 13.1h3.7"></path></svg></span> WhatsApp</span>
            <span class="arrow">→</span>
          </a>

          <a class="btn" href="https://instagram.com/alessandro.torchia8" target="_blank" rel="noopener">
            <span class="left"><span class="icon icon-instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.8" y="4.8" width="14.4" height="14.4" rx="4.4"></rect><circle cx="12" cy="12" r="3.4"></circle><circle cx="16.7" cy="7.4" r="1"></circle></svg></span> Instagram</span>
            <span class="arrow">→</span>
          </a>
        </div>
      </section>
    </div>
  </main>

  <script>
    const contact = {
      firstName: "Alessandro",
      lastName: "Torchia",
      nickname: "Torchia",
      phone: "+393921492843",
      email: "alessandrotorchia@proton.me",
      instagram: "https://instagram.com/alessandro.torchia8",
      note: ""
    };

    function escapeVCard(value) {
      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/,/g, "\\,")
        .replace(/;/g, "\\;");
    }

    function downloadVCard() {
      const fullName = `${contact.firstName} ${contact.lastName}`.trim();

      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `N:${escapeVCard(contact.lastName)};${escapeVCard(contact.firstName)};;;`,
        `FN:${escapeVCard(fullName)}`,
        `NICKNAME:${escapeVCard(contact.nickname)}`,
        `TEL;TYPE=CELL:${escapeVCard(contact.phone)}`,
        `EMAIL;TYPE=INTERNET:${escapeVCard(contact.email)}`,
        `X-SOCIALPROFILE;TYPE=instagram:${escapeVCard(contact.instagram)}`,
        `NOTE:${escapeVCard(contact.note)}`,
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${contact.firstName}-${contact.lastName}.vcf`.replace(/\s+/g, "-");
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
